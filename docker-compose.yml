# Investment Assistant - local-machine Docker Compose
#
# All published ports bind to loopback. PostgreSQL and the app remain on the
# private Compose network; Nginx is the only host-facing entry point.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-ia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ia_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    image: investment-assistant:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OPENBLAS_NUM_THREADS: ${LLM_N_THREADS:-4}
      OMP_NUM_THREADS: ${LLM_N_THREADS:-4}
    volumes:
      - reports:/app/reports
      - ./models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./config/nginx/rate-limit.conf:/etc/nginx/conf.d/00-rate-limit.conf:ro
      - ./config/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  reports:

networks:
  internal:
    driver: bridge
