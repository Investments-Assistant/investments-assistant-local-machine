name: End-to-End Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Step 1: Unit tests ─────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  # ── Step 2: Integration tests (depends on unit tests passing) ──────────────
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  # ── Step 3: Merge coverage reports and final SonarCloud gate ──────────────
  sonar-quality-gate:
    name: SonarCloud Quality Gate (combined coverage)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, browser-tests]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # NOSONAR — throwaway CI-only credential
          POSTGRES_DB: test_investments
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.3.4"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Mark the disposable combined-coverage database
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d test_investments -v ON_ERROR_STOP=1
          -c "CREATE TABLE ia_disposable_marker(token text NOT NULL);
          INSERT INTO ia_disposable_marker VALUES ('ci-isolated-service');"

      - name: Run all tests together with combined coverage
        env:
          ENVIRONMENT: development
          TEST_DATABASE_DISPOSABLE_TOKEN: ci-isolated-service
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/investments"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_investments"
        run: |
          poetry run pytest \
            --cov=src \
            --cov-report=xml:coverage-combined.xml \
            --cov-report=term-missing \
            --junitxml=junit-e2e.xml \
            -v

      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-combined
          path: coverage-combined.xml

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: junit-e2e.xml

      - name: SonarCloud Scan (combined)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage-combined.xml
            -Dsonar.testExecutionReportPaths=junit-e2e.xml

      - name: SonarCloud Quality Gate check
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  browser-tests:
    name: Chromium + PostgreSQL (synthetic model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # Disposable CI-only value
          POSTGRES_DB: test_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_browser
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_browser
      TEST_DATABASE_DISPOSABLE_TOKEN: ci-browser-isolated
      PLAYWRIGHT_BROWSERS_PATH: /tmp/ia-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: "2.3.4"
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Install isolated Chromium dependencies
        run: poetry run playwright install --with-deps chromium --only-shell
      - name: Mark and migrate disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_browser -v ON_ERROR_STOP=1 -c "CREATE TABLE ia_disposable_marker(token text NOT NULL); INSERT INTO ia_disposable_marker VALUES ('ci-browser-isolated');"
          poetry run alembic upgrade head
      - name: Exercise real browser routes and isolation
        run: poetry run python scripts/verify_browser.py > docs/acceptance/evidence/browser-ci.txt 2>&1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-synthetic-evidence
          path: |
            docs/acceptance/evidence/browser-ci.txt
            /tmp/ia-browser-evidence
