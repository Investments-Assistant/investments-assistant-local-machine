name: Local-machine Release Validation

# Manual validation only. Installing on an existing instance needs operator approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret validation configuration
        run: cp .env.example .env
      - name: Validate Compose structure
        run: docker compose config --quiet
      - name: Build CPU image for local-machine architecture
        run: docker build --platform linux/amd64 -t investment-assistant:local-validation .
      - name: Inspect the built image
        run: docker image inspect investment-assistant:local-validation --format '{{.Architecture}} {{.Id}}'
